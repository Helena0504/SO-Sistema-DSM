# ============================================================
# sistema.conf
# Este documento se encarga de determinar valores de configuracion para todo el sistema
# El formato es clave=valor
# Configuracion compartida entre todos los nodos
# ============================================================

# ---- Memoria ----
# Tamanno de pagina
pageSize=4096 #4KB
# Memoria aportada por cada nodo
memoriaNodo=1048576 #1MB
# Direccion base igual entre todos los nodos
direccionBase=0x700000000000
# Algoritmo de asignacion de paginas.
algoritmoAsignacion=ROUND_ROBIN #Podria cambiar a FCFS o a PRIORITY
# Algoritmo de reemplazo de paginas
algoritmoReemplazo=LRU #Podria cambiar a FIFO


# ---- Red ----
# Puertos de comunicacion (esto cambia segun se nos asignen nuestros 100 puertos)
#Puerto Base
puertoBase=28000
# Puerto de nodos
puertoNodos=28001
# Puerto solo para heartbeat
puertoHeartbeat=28002
# Puerto de pages
puertoPages=28003
# Puerto de consultas
puertoConsulta=28004


# ---- Nodos ----
# Editar solo esta lista al cambiar de computadoras.
# El primer ID de la lista es el nodo que inicia el contenido de demostracion.
nodos=0:192.168.186.128,1:192.168.186.130
# La IP propia se determina automaticamente usando nodos=.
ipLocal=0.0.0.0

# ---- Hearbeat ----
# Cada cuanto se hace haerbeat
pausaH=1000 
# En cuanto tiempo se declara un nodo muerto
muertoH=3000 # 3 fallos en total


# ---- Logs ----
# Las opciones son estas, dejo INFO por default: TRACE | DEBUG | INFO | WARNING | ERROR
logLevel=INFO
# Archivo de log. Cambia segun nodo, por ejemplo dsm_nodo_2.log
logArchivo=dsm_nodo.log



# ------------------------------------------------------------
# EXTRAS
# ------------------------------------------------------------
# Ejecucion distribuida de procesos entre nodos
ejecucionDistribuida=false

# Tolerancia a fallos mediante replicacion de paginas
replicacion=false


